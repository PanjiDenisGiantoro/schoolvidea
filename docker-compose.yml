version: '3.3'

services:
    # PostgreSQL Master
    postgres-master:
        image: postgres:16-alpine
        container_name: postgres_master
        environment:
            POSTGRES_DB: ${DB_NAME:-laravel}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
            POSTGRES_REPLICATION_MODE: master
            POSTGRES_REPLICATION_USER: ${REPLICATION_USER:-replicator}
            POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replication_password}
        ports:
            - "5432:5432"
        volumes:
            - postgres_master_data:/var/lib/postgresql/data
            - ./docker/postgres/master/postgresql.conf:/etc/postgresql/postgresql.conf
            - ./docker/postgres/master/pg_hba.conf:/etc/postgresql/pg_hba.conf
            - ./docker/postgres/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh
        networks:
            - laravel_network
        command: >
            -c config_file=/etc/postgresql/postgresql.conf
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # PostgreSQL Slave (Replica)
    postgres-slave:
        image: postgres:16-alpine
        container_name: postgres_slave
        environment:
            POSTGRES_DB: ${DB_NAME:-laravel}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
            POSTGRES_MASTER_SERVICE: postgres-master
            POSTGRES_REPLICATION_MODE: slave
            POSTGRES_REPLICATION_USER: ${REPLICATION_USER:-replicator}
            POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replication_password}
        ports:
            - "5433:5432"
        volumes:
            - postgres_slave_data:/var/lib/postgresql/data
            - ./docker/postgres/slave/postgresql.conf:/etc/postgresql/postgresql.conf
            - ./docker/postgres/slave/pg_hba.conf:/etc/postgresql/pg_hba.conf
            - ./docker/postgres/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh
        networks:
            - laravel_network
        depends_on:
            - postgres-master
        command: >
            -c config_file=/etc/postgresql/postgresql.conf
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # FrankenPHP dengan Laravel
    frankenphp:
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
        image: schoolvidea/frankenphp:latest
        container_name: frankenphp_app
        working_dir: /app
        environment:
            APP_NAME: ${APP_NAME:-Laravel}
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: ${APP_DEBUG:-true}
            APP_URL: ${APP_URL:-http://localhost}
            DB_CONNECTION: pgsql
            DB_HOST: postgres-master
            DB_PORT: 5432
            DB_DATABASE: ${DB_NAME:-laravel}
            DB_USERNAME: ${DB_USER:-postgres}
            DB_PASSWORD: ${DB_PASSWORD:-password}
            DB_SLAVE_HOST: postgres-slave
            DB_SLAVE_PORT: 5432
            REDIS_HOST: redis
            REDIS_PORT: 6379
        expose:
            - "8000"
        volumes:
            - .:/app
            - ./docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile
        networks:
            - laravel_network
        depends_on:
            - postgres-master
            - postgres-slave
            - redis
        command: >
            sh -c "
              composer install --no-dev --optimize-autoloader &&
              php artisan config:cache &&
              php artisan view:cache &&
              frankenphp run --config /etc/caddy/Caddyfile
            "

    # Redis (untuk caching)
    redis:
        image: redis:7-alpine
        container_name: redis_cache
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - laravel_network
        command: redis-server --appendonly yes

networks:
    laravel_network:
        driver: bridge

volumes:
    postgres_master_data:
    postgres_slave_data:
    redis_data:
