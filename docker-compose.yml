version: '3.8'

services:
    app:
        image: php:8.2-fpm
        container_name: laravel-app
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        networks:
            - laravel-network
        depends_on:
            - db
        restart: always

    db:
        image: postgres:14
        container_name: postgres-db
        environment:
            POSTGRES_DB: school
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: W@rung01
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - laravel-network
        restart: always

    nginx:
        image: nginx:alpine
        container_name: nginx
        ports:
            - "8080:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - .:/var/www/html
        networks:
            - laravel-network
        depends_on:
            - app
        restart: always

networks:
    laravel-network:
        driver: bridge

volumes:
    db_data:
