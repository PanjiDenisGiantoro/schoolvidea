# Konfigurasi Nginx untuk sps.videaclass.com
# FrankenPHP berjalan di Docker, Nginx di luar Docker sebagai reverse proxy

# HTTP - Redirect ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sps.videaclass.com;

    # Redirect semua traffic HTTP ke HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS - Main Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sps.videaclass.com;

    # SSL Certificate Configuration
    # Ganti dengan path certificate Anda
    ssl_certificate /etc/letsencrypt/live/sps.videaclass.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sps.videaclass.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sps.videaclass.com/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/sps.videaclass.com.access.log;
    error_log /var/log/nginx/sps.videaclass.com.error.log;

    # Client Upload Size
    client_max_body_size 100M;

    # Timeouts
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Proxy ke FrankenPHP Container
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffer Settings
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Static files optimization (optional - jika ingin serve static dari nginx)
    # Uncomment jika Anda mount public directory
    # location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    #     root /path/to/schoolvidea/public;
    #     try_files $uri @frankenphp;
    # }

    # location @frankenphp {
    #     proxy_pass http://localhost:8000;
    # }

    # Health Check Endpoint
    location /health {
        proxy_pass http://localhost:8000/health;
        access_log off;
    }
}
