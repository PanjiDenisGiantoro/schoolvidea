# Temporary HTTP-only configuration
# Use this for initial certificate setup

server {
    listen 80;
    server_name sps.videaclass.com;

    # Certbot challenge - IMPORTANT for certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Root directory
    root /app/public;
    index index.php index.html;

    # Main location - proxy to FrankenPHP
    location / {
        try_files $uri $uri/ @frankenphp;
    }

    # FrankenPHP proxy
    location @frankenphp {
        proxy_pass http://frankenphp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # PHP files - proxy to FrankenPHP
    location ~ \.php$ {
        proxy_pass http://frankenphp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}