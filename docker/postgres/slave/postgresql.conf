# PostgreSQL Slave (Replica) Configuration
# =========================================

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Settings
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 128MB
work_mem = 4MB

# Replica Settings
hot_standby = on
hot_standby_feedback = on

# WAL Settings
wal_level = replica
max_wal_senders = 10
wal_keep_size = 1GB

# Recovery Settings
primary_conninfo = 'host=postgres-master port=5432 user=replicator password=replication_password'
primary_slot_name = 'replica_slot'

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'ddl'

# Performance
random_page_cost = 1.1
effective_io_concurrency = 200

# Timezone
timezone = 'UTC'
