name: Deploy to Production

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            cd /var/www/html/schoolvidea

            # Fix git ownership issue
            git config --global --add safe.directory /var/www/html/schoolvidea

            # Fix directory ownership for current user
            sudo chown -R videa_sps:www-data /var/www/html/schoolvidea

            # Put application in maintenance mode
            php artisan down --retry=60 || php artisan down || true

            # Backup database before deployment
            BACKUP_NAME="backup_$(date +%Y%m%d_%H%M%S).sql"
            php artisan db:backup || echo "⚠️  Database backup skipped"

            # Pull latest code
            git fetch origin master
            git reset --hard origin/master

            # Clean vendor and cache directories
            if [ -d "vendor" ]; then
              sudo rm -rf vendor
            fi
            sudo rm -f bootstrap/cache/*.php

            # Fix permissions before composer install
            sudo chmod -R 775 storage bootstrap/cache
            sudo chown -R videa_sps:www-data storage bootstrap/cache

            # Install/Update dependencies
            composer install

            # Fix permissions for Laravel to write logs and cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo chown -R videa_sps:www-data storage bootstrap/cache

            # Clear all caches
            php artisan config:clear || true
            php artisan cache:clear || true
            php artisan route:clear || true
            php artisan view:clear || true

            # Run migrations
            php artisan migrate --force || true

            # Cache configurations for better performance
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true

            # Final permission fix - give to www-data for web server
            sudo chmod -R 775 storage bootstrap/cache
            sudo chown -R www-data:www-data storage bootstrap/cache

            # Bring application back online
            php artisan up || true

            echo "✅ Production deployment completed successfully!"
