name: Deploy to Development

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          script: |
            cd /var/www/html/schoolvideadev

            # Fix git ownership issue
            git config --global --add safe.directory /var/www/html/schoolvideadev

            # Fix directory ownership for current user
            sudo chown -R videa_sps:www-data /var/www/html/schoolvideadev

            # Set proper permissions before operations
            sudo chmod -R 775 storage bootstrap/cache vendor
            sudo chown -R videa_sps:www-data storage bootstrap/cache vendor

            # Pull latest code
            git fetch origin develop
            git reset --hard origin/develop

            # Clean vendor directory if exists
            if [ -d "vendor" ]; then
              sudo rm -rf vendor
            fi

            # Install/Update dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Set permissions for Laravel directories
            sudo chmod -R 775 storage bootstrap/cache
            sudo chown -R www-data:www-data storage bootstrap/cache

            # Clear all caches
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            # Run migrations
            php artisan migrate --force

            # Cache configurations for better performance
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Final permission fix
            sudo chmod -R 775 storage bootstrap/cache
            sudo chown -R www-data:www-data storage bootstrap/cache

            echo "✅ Development deployment completed successfully!"
