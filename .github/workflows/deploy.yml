name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_pgsql, redis, gd, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
        run: php artisan test

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            APP_DIR="/home/videa_payment/schoolvidea"
            BACKUP_DIR="/home/videa_payment/schoolvidea_backup"
            REPO_URL="https://github.com/PanjiDenisGiantoro/schoolvidea.git"

            # Add GitHub to known_hosts
            mkdir -p ~/.ssh
            ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

            # Stop containers
            cd $APP_DIR
            sudo docker-compose down || true

            # Backup important files
            sudo mkdir -p $BACKUP_DIR
            sudo cp -f $APP_DIR/.env $BACKUP_DIR/.env 2>/dev/null || true
            sudo cp -rf $APP_DIR/storage $BACKUP_DIR/storage 2>/dev/null || true

            # Remove old directory and clone fresh
            cd /home/videa_payment
            sudo rm -rf $APP_DIR
            git clone $REPO_URL schoolvidea

            # Restore important files
            sudo cp -f $BACKUP_DIR/.env $APP_DIR/.env 2>/dev/null || true
            sudo cp -rf $BACKUP_DIR/storage/* $APP_DIR/storage/ 2>/dev/null || true

            # Fix permissions
            cd $APP_DIR
            sudo chown -R root:root .
            sudo chmod -R 755 .
            sudo chmod +x deploy.sh

            # Run deployment script
            sudo ./deploy.sh
